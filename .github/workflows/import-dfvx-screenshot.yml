name: Import dfVX plugin screenshot
on:
  push:
    paths:
      - '.github/workflows/import-dfvx-screenshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import actual dfVX GUI capture
        shell: bash
        env:
          SCREENSHOT_ZIP_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-b388-822f-8d9a-c1a86aa33943/raw?se=2026-11-10T03%3A38%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=28d82b26-b59e-5dad-b033-83e89fcaf452&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-09T22%3A19%3A53Z&ske=2026-11-10T22%3A19%3A53Z&sks=b&skv=2026-02-06&sig=3OBBcjsmpBUCwuhO5bvc3ll4ifiFiVBx3EMklAVTg3M%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 "$SCREENSHOT_ZIP_URL" --output /tmp/dfvx-gui.zip
          unzip -t /tmp/dfvx-gui.zip
          mkdir -p images
          unzip -p /tmp/dfvx-gui.zip DfVx-window.png > images/dfvx-plugin.png
          test $(stat -c%s images/dfvx-plugin.png) -gt 100000
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add images/dfvx-plugin.png
          git diff --cached --quiet && exit 0
          git commit -m "Add dfVX plugin screenshot"
          git push
