name: Publish dfVX 0.1.0 with manual
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dfvx-with-manual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original release files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/user-attachments/files/34610014/dfVX-0.1.0-Windows-VST3-x64.zip' -o /tmp/dfVX-original.zip
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/user-attachments/files/34610720/dfVX_User_Manual_Updated.pdf' -o /tmp/dfVX-manual.pdf
          printf '%s  %s\n' 'cf77ef2a3feccdfabc9240544275952d32bd0229362932eb333d859fde75e85b' /tmp/dfVX-original.zip | sha256sum --check
          printf '%s  %s\n' '0e220e8d657760c1220ee4002e775a85ddfe159f26945ead0081f00ba3dd8f41' /tmp/dfVX-manual.pdf | sha256sum --check
      - name: Repackage original VST3 ZIP with PDF manual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dfvx-publish
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from shutil import copyfile
          src = Path('/tmp/dfVX-original.zip')
          dst = Path('/tmp/dfvx-publish/dfVX-0.1.0-Windows-VST3-x64.zip')
          pdf = Path('/tmp/dfVX-manual.pdf')
          copyfile(src,dst)
          with ZipFile(dst,'a',compression=ZIP_DEFLATED,compresslevel=9) as z:
              names = z.namelist()
              assert 'dfVX.vst3/Contents/x86_64-win/dfVX.vst3' in names, names
              assert 'README.txt' in names and 'RELEASE_NOTES.txt' in names
              assert not any(n.lower().endswith(('.pdf','.lib','.exp')) for n in names)
              z.write(pdf,'dfVX_User_Manual_Updated.pdf',compress_type=ZIP_DEFLATED,compresslevel=9)
          with ZipFile(dst) as z:
              assert z.testzip() is None
              assert z.read('dfVX_User_Manual_Updated.pdf') == pdf.read_bytes()
              print('Verified new ZIP:', z.namelist())
          PY
          cp /tmp/dfVX-manual.pdf /tmp/dfvx-publish/dfVX_User_Manual_Updated.pdf
          (cd /tmp/dfvx-publish && sha256sum dfVX-0.1.0-Windows-VST3-x64.zip dfVX_User_Manual_Updated.pdf > SHA256SUMS.txt)
          cat /tmp/dfvx-publish/SHA256SUMS.txt
      - name: Publish verified downloadable files to existing v0.1.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.1.0 --repo "${{ github.repository }}" >/dev/null
          gh release upload v0.1.0 \
            /tmp/dfvx-publish/dfVX-0.1.0-Windows-VST3-x64.zip \
            /tmp/dfvx-publish/dfVX_User_Manual_Updated.pdf \
            /tmp/dfvx-publish/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --clobber
          cat > /tmp/dfvx-release-notes.md <<'NOTES'
          ## dfVX 0.1.0 — Windows x64 VST3

          Download **dfVX-0.1.0-Windows-VST3-x64.zip** under **Assets**. This package includes the full **dfVX.vst3** bundle, **README.txt** installation instructions, **RELEASE_NOTES.txt**, and the **illustrated PDF user manual**.

          The **dfVX_User_Manual_Updated.pdf** user manual is also available as a separate download.

          ### Installation

          Extract the complete ZIP, close your DAW, and copy the full `dfVX.vst3` folder into `C:\Program Files\Common Files\VST3`. Restart or rescan your DAW's VST3 plugins as needed.

          ### Verification

          Use the accompanying **SHA256SUMS.txt** to check the ZIP and separate PDF. The release does **not** contain source code or unnecessary `.lib` or `.exp` development files. GitHub's automatically generated **Source code** archives do not contain the installable VST3 binary.

          This is an unsigned Windows x64 build. Host compatibility can vary.
          NOTES
          gh release edit v0.1.0 --repo "${{ github.repository }}" --notes-file /tmp/dfvx-release-notes.md
